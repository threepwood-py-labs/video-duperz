name: CI

on:
  push:
    branches: [develop, main, master]
  pull_request:
    branches: [develop, main, master]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    name: Lint & Types
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Install Hatch
        run: uv tool install hatch

      - name: Run linting
        run: hatch run lint:check

      - name: Run formatting check
        run: hatch run lint:fmt

      - name: Run type checking
        run: hatch run lint:types

      - name: Run dependency checks
        run: hatch run lint:deps

      - name: Advisory dead code checks
        run: hatch run lint:deadcode
        continue-on-error: true

      - name: Advisory complexity checks
        run: hatch run lint:complexity
        continue-on-error: true

      - name: Run policy checks
        run: hatch run lint:policy

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: windows-latest
    timeout-minutes: 30
    env:
      USERPROFILE: ${{ runner.temp }}\video-duperz-user
      APPDATA: ${{ runner.temp }}\video-duperz-user\AppData\Roaming
      LOCALAPPDATA: ${{ runner.temp }}\video-duperz-user\AppData\Local
      TEMP: ${{ runner.temp }}\video-duperz-temp
      TMP: ${{ runner.temp }}\video-duperz-temp
      QT_QPA_PLATFORM: offscreen
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install Hatch
        run: uv tool install hatch

      - name: Prepare isolated test profile
        shell: pwsh
        run: |
          $paths = @(
            $env:USERPROFILE
            $env:APPDATA
            $env:LOCALAPPDATA
            $env:TEMP
          )
          foreach ($path in $paths) {
            New-Item -ItemType Directory -Force -Path $path | Out-Null
          }

      - name: Run tests with coverage
        run: hatch run test-cov

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        if: ${{ matrix.python-version == '3.13' }}
        with:
          files: coverage.xml
          fail_ci_if_error: false
