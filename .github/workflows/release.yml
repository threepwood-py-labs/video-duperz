name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      release_tag:
        description: Release tag to build, such as v0.1.1
        required: true
        default: v0.1.1
      release_name:
        description: Display name for the GitHub Release
        required: true
        default: Video Duperz v0.1.1
      draft_release:
        description: Create the GitHub Release as a draft
        required: true
        default: true
        type: boolean

jobs:
  build-portable:
    name: Build Portable Release
    runs-on: windows-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.release_tag || github.ref_name }}
          fetch-depth: 0

      - name: Resolve release metadata
        shell: pwsh
        run: |
          $releaseTag = "${{ github.ref_name }}"
          $releaseName = "Video Duperz $releaseTag"
          $draftRelease = "false"
          if ("${{ github.event_name }}" -eq "workflow_dispatch") {
              $releaseTag = "${{ inputs.release_tag }}"
              $releaseName = "${{ inputs.release_name }}"
              $draftRelease = "${{ inputs.draft_release }}".ToLowerInvariant()
          }
          if ($releaseTag -notmatch '^v\d+\.\d+\.\d+$') {
              throw "Release tag '$releaseTag' must match vMAJOR.MINOR.PATCH."
          }
          "RELEASE_TAG=$releaseTag" >> $env:GITHUB_ENV
          "RELEASE_NAME=$releaseName" >> $env:GITHUB_ENV
          "DRAFT_RELEASE=$draftRelease" >> $env:GITHUB_ENV

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version-file: .python-version

      - name: Validate release tag matches project version
        shell: pwsh
        run: |
          @'
          from __future__ import annotations

          import sys
          import tomllib
          from pathlib import Path

          release_tag = sys.argv[1]
          pyproject = tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))
          version = str(pyproject["project"]["version"])
          expected_tag = f"v{version}"
          if release_tag != expected_tag:
              raise SystemExit(
                  f"Release tag {release_tag!r} does not match project version "
                  f"{version!r}; expected {expected_tag!r}."
              )
          '@ | python - $env:RELEASE_TAG

      - name: Install Hatch
        run: uv tool install hatch

      - name: Run linting
        run: hatch run lint:check

      - name: Run formatting check
        run: hatch run lint:fmt

      - name: Run type checking
        run: hatch run lint:types

      - name: Run policy checks
        run: hatch run lint:policy

      - name: Run tests with coverage
        run: hatch run test-cov

      - name: Prepare project environment
        run: python scripts/windows/setup_env.py

      - name: Build standalone executable
        run: python scripts/windows/build_nuitka.py

      - name: Package portable release zip
        run: >
          python scripts/windows/package_release.py
          --release-tag "${{ env.RELEASE_TAG }}"

      - name: Attest portable release zip
        uses: actions/attest@v4
        with:
          subject-path: ${{ github.workspace }}/build/release/*.zip

      - name: Upload portable artifact
        uses: actions/upload-artifact@v4
        with:
          name: video-duperz-${{ env.RELEASE_TAG }}-windows-x64
          path: build/release/*.zip

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.RELEASE_TAG }}
          name: ${{ env.RELEASE_NAME }}
          draft: ${{ env.DRAFT_RELEASE == 'true' }}
          generate_release_notes: true
          files: build/release/*.zip
